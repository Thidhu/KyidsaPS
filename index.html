<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kyidsa Primary School — Teacher Records</title>

<!-- Home screen / PWA icon setup — reuses the same logo already used in the header -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="images/logo.png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<meta name="theme-color" content="#14213d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kyidsa PS" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg"></div>
  <div class="page-stars" id="page-stars"></div>
  <audio id="bg-audio" loop preload="auto"></audio>

  <div id="boot-loader">
    <img class="boot-logo" src="images/logo.png" alt="Kyidsa Primary School logo" onerror="this.style.display='none'" />
    <div class="boot-percent" id="boot-percent">0%</div>
    <div class="boot-bar"><div class="boot-bar-fill" id="boot-bar-fill"></div></div>
  </div>

  <div id="app">Connecting to the Server…</div>
  <script src="script.js"></script>
</body>
</html>
